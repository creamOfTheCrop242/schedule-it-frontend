<section class="p-4">
  <a
    routerLink="/habits"
    class="mb-4 inline-flex items-center gap-2 text-sm text-gray-400 transition-colors hover:text-white focus:outline-none focus:ring-2 focus:ring-purple-500 rounded"
  >
    <span class="material-icons text-lg leading-none" aria-hidden="true"
      >arrow_back</span
    >
    Back to habits
  </a>

  <h2 class="text-xl font-bold mb-4 text-white">Create habit</h2>

  @if (errorMessage()) {
    <div class="mb-4 rounded-md bg-red-100 p-3 text-red-700">
      {{ errorMessage() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" [formGroup]="form" class="space-y-4">
    <div>
      <label for="habit-name" class="block text-sm font-medium mb-2 text-gray-200"
        >Name *</label
      >
      <app-input
        [id]="'habit-name'"
        placeholder="e.g. Morning meditation"
        [name]="form.controls['name']"
        type="text"
      ></app-input>
    </div>

    <div>
      <label
        for="habit-description"
        class="block text-sm font-medium mb-2 text-gray-200"
        >Description</label
      >
      <app-input
        [id]="'habit-description'"
        placeholder="Optional details"
        type="textarea"
        [name]="form.controls['description']"
      ></app-input>
    </div>

    <div class="pt-4">
      <button
        type="submit"
        [disabled]="!form.valid"
        class="w-full bg-purple-600 text-white py-2 px-4 rounded-md hover:bg-purple-700 disabled:bg-gray-400 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-purple-400"
      >
        Create habit
      </button>
    </div>
  </form>
</section>
