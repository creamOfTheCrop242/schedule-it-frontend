<section
  class="mx-auto max-w-2xl space-y-6 p-4 pb-24"
  aria-label="Story of the day"
>
  <header class="space-y-2">
    <a
      routerLink="/dashboard"
      class="inline-flex items-center gap-1 text-sm font-medium text-purple-300 hover:text-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-500 rounded"
    >
      <span class="material-icons text-lg" aria-hidden="true">arrow_back</span>
      Home
    </a>
    <h1 class="text-2xl font-semibold tracking-tight text-white">Story of the day</h1>
    @if (storyDate()) {
      <p class="text-sm text-gray-400">UTC day {{ storyDate()! }}</p>
    }
  </header>

  <div
    class="rounded-3xl border border-gray-600 bg-[#2c2c2c] p-4 shadow-lg shadow-black/10"
  >
    @if (loading()) {
      <div class="flex items-center gap-3 py-8 text-gray-400" role="status">
        <span
          class="h-5 w-5 shrink-0 rounded-full border-2 border-gray-600 border-t-purple-500 motion-safe:animate-spin motion-reduce:animate-none"
          aria-hidden="true"
        ></span>
        <span>Loading…</span>
      </div>
    } @else if (error()) {
      <p class="text-sm text-red-300" role="alert">{{ error() }}</p>
    } @else if (story()) {
      <pre
        class="story-body m-0 whitespace-pre-wrap font-sans text-sm leading-relaxed text-gray-200"
        >{{ story() }}</pre
      >
    }
  </div>
</section>
