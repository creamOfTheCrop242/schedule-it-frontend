<section class="p-4">
  <h2 class="text-xl font-bold mb-4">
    {{ id ? "Edit Log" : "Add New Log" }}
  </h2>

  @if (errorMessage()) {
    <div class="mb-4 rounded-md bg-red-100 p-3 text-red-700">
      {{ errorMessage() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" [formGroup]="form" class="space-y-4">
    <div>
      <label for="log-name" class="block text-sm font-medium mb-2">Log Name *</label>
      <app-input
        [id]="'log-name'"
        placeholder="Enter log name"
        [name]="form.controls['name']"
        type="text"
      ></app-input>
    </div>

    <div>
      <label for="log-description" class="block text-sm font-medium mb-2">Description</label>
      <app-input
        [id]="'log-description'"
        placeholder="Enter log description"
        [name]="form.controls['description']"
        type="textarea"
      ></app-input>
    </div>

    <div>
      <label for="log-surroundings" class="block text-sm font-medium mb-2">Surroundings</label>
      <app-input
        [id]="'log-surroundings'"
        placeholder="e.g. Coffee shop, Home office"
        [name]="form.controls['surroundings']"
        type="textarea"
      ></app-input>
    </div>

    <div>
      <label for="log-mood" class="block text-sm font-medium mb-2">Mood</label>
      <select
        id="log-mood"
        formControlName="moodPreset"
        class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500"
      >
        <option value="">Select mood (optional)</option>
        @for (option of moodPresetOptions; track option) {
          @if (option) {
            <option [value]="option">{{ option }}</option>
          }
        }
      </select>
    </div>

    @if (form.get('moodPreset')?.value === 'Custom') {
      <div>
        <label for="log-mood-custom" class="block text-sm font-medium mb-2">Custom mood</label>
        <app-input
          [id]="'log-mood-custom'"
          placeholder="How's your mood?"
          [name]="form.controls['moodCustom']"
          type="text"
        ></app-input>
      </div>
    }

    <div>
      <label class="block text-sm font-medium mb-2">Priority *</label>
      <select
        formControlName="priority"
        class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500"
      >
        @for (option of priorityOptions; track option) {
          <option [value]="option">{{ option }}</option>
        }
      </select>
    </div>

    <div>
      <label for="log-start-time" class="block text-sm font-medium mb-2">Start Time</label>
      <app-input
        [id]="'log-start-time'"
        placeholder="Select start time"
        [name]="form.controls['startTime']"
        type="datetime-local"
      ></app-input>
    </div>

    <div>
      <label for="log-end-time" class="block text-sm font-medium mb-2">End Time</label>
      <app-input
        [id]="'log-end-time'"
        placeholder="Select end time"
        [name]="form.controls['endTime']"
        type="datetime-local"
      ></app-input>
    </div>

    <div class="flex items-center">
      <input
        type="checkbox"
        formControlName="completed"
        id="completed"
        class="mr-2"
      />
      <label for="completed" class="text-sm font-medium"
        >Mark as completed</label
      >
    </div>

    @if (form.get('completed')?.value) {
    <div>
      <label for="log-completed-date" class="block text-sm font-medium mb-2">Completed Date</label>
      <app-input
        [id]="'log-completed-date'"
        placeholder="Select completion date"
        [name]="form.controls['completedDate']"
        type="datetime-local"
      ></app-input>
    </div>
    }

    <div>
      <label class="block text-sm font-medium mb-2">Dependency Log</label>
      <select
        formControlName="dependencyLogId"
        class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500"
      >
        <option value="">No dependency (optional)</option>
        @for (log of availableLogs(); track log.id) {
        <option [value]="log.id">{{ log.name }}</option>
        }
      </select>
    </div>

    <div class="pt-4">
      <button
        type="submit"
        [disabled]="!form.valid"
        class="w-full bg-purple-600 text-white py-2 px-4 rounded-md hover:bg-purple-700 disabled:bg-gray-400 disabled:cursor-not-allowed"
      >
        {{ id ? "Update Log" : "Create Log" }}
      </button>
    </div>
  </form>
</section>
