<section class="p-4">
  <h2 class="text-xl font-bold mb-4">
    {{ id ? "Edit Goal" : "Add New Goal" }}
  </h2>

  @if (errorMessage()) {
    <div class="mb-4 rounded-md bg-red-100 p-3 text-red-700">
      {{ errorMessage() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" [formGroup]="form" class="space-y-4">
    <!-- Metric -->
    <div>
      <label class="block text-sm font-medium mb-2">Metric *</label>
      <select
        formControlName="metric"
        class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500"
      >
        @for (option of metricOptions; track option) {
          <option [value]="option">{{ option }}</option>
        }
      </select>
      <p class="mt-2 text-xs text-gray-400">
        Logs added = new logs you create. Logs completed = logs you mark
        complete. The daily number below applies to whichever metric you pick.
      </p>
    </div>

    <!-- Daily Target -->
    <div>
      <label class="block text-sm font-medium mb-2">Daily target *</label>
      <app-input
        placeholder="e.g. 3 logs per day"
        [name]="form.controls['target']"
        type="number"
      ></app-input>
      <p class="mt-2 text-xs text-gray-400">
        Weekly/monthly/yearly targets are derived automatically (×7 / ×30 / ×365).
      </p>
    </div>

    <!-- Submit Button -->
    <div class="pt-4">
      <button
        type="submit"
        [disabled]="!form.valid"
        class="w-full bg-purple-600 text-white py-2 px-4 rounded-md hover:bg-purple-700 disabled:bg-gray-400 disabled:cursor-not-allowed"
      >
        {{ id ? "Update Goal" : "Create Goal" }}
      </button>
    </div>
  </form>
</section>
