<div class="p-4">
  <h2 class="text-2xl font-semibold text-white mb-2">Log progress goal</h2>
  <p class="text-sm text-gray-400 mb-4">
    Set a <strong>daily</strong> target and choose whether you track
    <strong>logs added</strong> or <strong>logs completed</strong>. Weekly,
    monthly, and yearly bars use the same daily number (×7 / ×30 / ×365).
  </p>

  @if (isLoaded()) {
  <app-goal-card
    [goal]="dailyGoalStatus()"
    title="Daily"
    actionLabel="Edit daily goal"
    [actionLink]="dailyGoalStatus() ? '/goals/edit-goal/' + dailyGoalStatus()!.goalId : '/goals/add-goal'"
  ></app-goal-card>
  <app-goal-card
    [goal]="weeklyGoalStatus()"
    title="Weekly"
    note="Derived from your daily goal."
  ></app-goal-card>
  <app-goal-card
    [goal]="monthlyGoalStatus()"
    title="Monthly"
    note="Derived from your daily goal."
  ></app-goal-card>
  <app-goal-card
    [goal]="yearlyGoalStatus()"
    title="Yearly"
    note="Derived from your daily goal."
  ></app-goal-card>
  } @else {
  <p class="text-gray-400 text-sm">No goal data available</p>
  }
</div>
